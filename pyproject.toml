[project]
name = "bylaw"
version = "0.1.0"
description = "Compile a plain-English policy into a tuned Strands Decider 2B policy pack, and gate a Strands agent with it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "strands-agents==1.61.1",
    "boto3>=1.35",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The Decider server itself pulls torch and ~4.5 GB of base weights; tests never need it.
decider = ["strands-decider==0.1.0"]

[project.scripts]
bylaw = "bylaw.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bylaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs a running Decider server or Bedrock credentials"]

[tool.ruff]
line-length = 110
target-version = "py312"
